<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge,chrome=1" />
    <meta name="renderer" content="webkit" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
    <link rel="icon" href="/favicon.ico" />
    <title>%VITE_APP_TITLE%</title>
    <!--[if lt IE 11
      ]><script>
        window.location.href = '/html/ie.html';
      </script><!
    [endif]-->
    <style>
      html,
      body,
      #app {
        height: 100%;
        margin: 0px;
        padding: 0px;
      }

      .chromeframe {
        margin: 0.2em 0;
        background: #ccc;
        color: #000;
        padding: 0.2em 0;
      }

      #loader-wrapper {
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        z-index: 999999;
        display: flex;
        align-items: center;
        justify-content: center;
        overflow: hidden;
        background:
          radial-gradient(circle at top, rgba(251, 146, 60, 0.28), transparent 42%),
          radial-gradient(circle at 20% 80%, rgba(249, 115, 22, 0.18), transparent 30%),
          linear-gradient(135deg, #fff7f2 0%, #ffe6d4 28%, #fdba74 100%);
      }

      .loader-shell {
        position: relative;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 22px;
        min-width: 320px;
        padding: 42px 46px 34px;
        border-radius: 32px;
        border: 1px solid rgba(255, 255, 255, 0.7);
        background: rgba(42, 20, 12, 0.72);
        box-shadow:
          0 28px 60px rgba(104, 48, 13, 0.22),
          inset 0 1px 0 rgba(255, 255, 255, 0.12);
        backdrop-filter: blur(18px);
        -webkit-backdrop-filter: blur(18px);
      }

      #loader {
        display: block;
        position: relative;
        width: 132px;
        height: 132px;
        margin: 0;
        border-radius: 50%;
        border: 3px solid transparent;
        border-top-color: #fff7ed;
        border-right-color: rgba(251, 146, 60, 0.8);
        -webkit-animation: spin 2s linear infinite;
        -ms-animation: spin 2s linear infinite;
        -moz-animation: spin 2s linear infinite;
        -o-animation: spin 2s linear infinite;
        animation: spin 2s linear infinite;
        z-index: 1;
      }

      #loader:before {
        content: '';
        position: absolute;
        top: 5px;
        left: 5px;
        right: 5px;
        bottom: 5px;
        border-radius: 50%;
        border: 3px solid transparent;
        border-top-color: #fdba74;
        border-right-color: rgba(255, 237, 213, 0.72);
        -webkit-animation: spin 3s linear infinite;
        -moz-animation: spin 3s linear infinite;
        -o-animation: spin 3s linear infinite;
        -ms-animation: spin 3s linear infinite;
        animation: spin 3s linear infinite;
      }

      #loader:after {
        content: '';
        position: absolute;
        top: 15px;
        left: 15px;
        right: 15px;
        bottom: 15px;
        border-radius: 50%;
        border: 3px solid transparent;
        border-top-color: #f97316;
        border-right-color: rgba(255, 247, 237, 0.68);
        -moz-animation: spin 1.5s linear infinite;
        -o-animation: spin 1.5s linear infinite;
        -ms-animation: spin 1.5s linear infinite;
        -webkit-animation: spin 1.5s linear infinite;
        animation: spin 1.5s linear infinite;
      }

      .loader-core {
        position: absolute;
        top: 50%;
        left: 50%;
        width: 22px;
        height: 22px;
        margin-top: -11px;
        margin-left: -11px;
        border-radius: 50%;
        background: linear-gradient(135deg, #fff7ed 0%, #fdba74 45%, #f97316 100%);
        box-shadow: 0 0 30px rgba(251, 146, 60, 0.45);
      }

      @-webkit-keyframes spin {
        0% {
          -webkit-transform: rotate(0deg);
          -ms-transform: rotate(0deg);
          transform: rotate(0deg);
        }

        100% {
          -webkit-transform: rotate(360deg);
          -ms-transform: rotate(360deg);
          transform: rotate(360deg);
        }
      }

      @keyframes spin {
        0% {
          -webkit-transform: rotate(0deg);
          -ms-transform: rotate(0deg);
          transform: rotate(0deg);
        }

        100% {
          -webkit-transform: rotate(360deg);
          -ms-transform: rotate(360deg);
          transform: rotate(360deg);
        }
      }

      .loaded .loader-shell {
        opacity: 0;
        transform: translateY(-16px) scale(0.98);
        -webkit-transition: all 0.35s ease-out;
        transition: all 0.35s ease-out;
      }

      .loaded #loader-wrapper {
        visibility: hidden;
        opacity: 0;
        -webkit-transition: all 0.45s 0.45s ease-out;
        transition: all 0.45s 0.45s ease-out;
      }

      .no-js #loader-wrapper {
        display: none;
      }

      .no-js h1 {
        color: #222222;
      }

      #loader-wrapper .load_title {
        font-family:
          'MiSans',
          'HarmonyOS Sans SC',
          'PingFang SC',
          'Microsoft YaHei',
          sans-serif;
        color: #fff7ed;
        font-size: 24px;
        font-weight: 700;
        letter-spacing: 0.02em;
        width: 100%;
        text-align: center;
        z-index: 1;
        opacity: 1;
        line-height: 1.4;
      }

      #loader-wrapper .load_subtitle {
        max-width: 360px;
        color: rgba(255, 237, 213, 0.8);
        font-size: 14px;
        text-align: center;
        line-height: 1.7;
        letter-spacing: 0.04em;
      }

      .loader-dots {
        display: inline-flex;
        align-items: center;
        gap: 8px;
      }

      .loader-dots span {
        width: 8px;
        height: 8px;
        border-radius: 50%;
        background: rgba(255, 237, 213, 0.34);
        animation: pulse 1.4s ease-in-out infinite;
      }

      .loader-dots span:nth-child(2) {
        animation-delay: 0.18s;
      }

      .loader-dots span:nth-child(3) {
        animation-delay: 0.36s;
      }

      @keyframes pulse {
        0%,
        100% {
          transform: translateY(0);
          background: rgba(255, 237, 213, 0.34);
        }

        50% {
          transform: translateY(-4px);
          background: #fdba74;
        }
      }
    </style>
  </head>

  <body>
    <div id="app">
      <div id="loader-wrapper" role="status" aria-live="polite">
        <div class="loader-shell">
          <div id="loader">
            <div class="loader-core"></div>
          </div>
          <div class="load_title">正在加载系统资源，请耐心等待</div>
          <div class="load_subtitle">
            品类实验室正在初始化工作台与分析模块
            <div class="loader-dots" aria-hidden="true">
              <span></span>
              <span></span>
              <span></span>
            </div>
          </div>
        </div>
      </div>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
